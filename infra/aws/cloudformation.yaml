AWSTemplateFormatVersion: '2010-09-09'
Description: 'My App Infrastructure with ECS and Blue-Green Deployment Support'

Parameters:
  # Project name used for resource naming
  ProjectName:
    Type: String
    Default: my-app
    Description: Name of the project

  # Skip ECR repository creation (useful for updates)
  SkipECRCreation:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Skip ECR repository creation

  # Create CodeDeploy application (useful for updates)
  CreateCodeDeployApp:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Create CodeDeploy application

  # Create CloudFront distributions
  CreateCloudFrontDistributions:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Create CloudFront distributions for API and UI

  # Keep existing CloudFront distributions
  KeepExistingCloudFront:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Keep existing CloudFront distributions even when CreateCloudFrontDistributions is false

  # Create UI Bucket
  CreateUIBucket:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether to create the UI bucket (set to false if it already exists)

  # Existing task definition ARN (for updates)
  ExistingTaskDefinitionArn:
    Type: String
    Default: ''
    Description: ARN of an existing task definition to use (leave empty to create a new one)

  # Create optional scheduled task infrastructure (EventBridge + CloudWatch + SNS)
  CreateScheduledTask:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Create EventBridge scheduled task, CloudWatch alarm, and SNS failure topic

  VpcId:
    Description: ID of the existing VPC
    Type: AWS::EC2::VPC::Id
    Default: vpc-XXXXXXXXX

  SubnetIds:
    Description: Comma-separated list of subnet IDs to deploy the ECS tasks and load balancer
    Type: CommaDelimitedList
    Default: subnet-XXXXXXXXX,subnet-YYYYYYYYY

  ContainerPort:
    Description: Port exposed by the container
    Type: Number
    Default: 3000

  DesiredCount:
    Type: Number
    Default: 1
    Description: Number of tasks to run

  TaskCpu:
    Description: CPU units for the task (1 vCPU = 1024 CPU units)
    Type: Number
    Default: 256

  TaskMemory:
    Description: Memory for the task in MiB
    Type: Number
    Default: 512

  CertificateArn:
    Type: String
    Default: ''
    Description: ARN of the ACM certificate for the custom domain (optional)

Conditions:
  CreateECRRepository: !Equals [!Ref SkipECRCreation, 'false']
  CreateNewTaskDefinition: !Equals [!Ref ExistingTaskDefinitionArn, '']
  ShouldCreateCodeDeployApp: !Equals [!Ref CreateCodeDeployApp, 'true']
  ShouldCreateCloudFrontDistributions: !Equals [!Ref CreateCloudFrontDistributions, 'true']
  ShouldCreateUIBucket: !Equals [!Ref CreateUIBucket, 'true']
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  HasCloudFrontWithCert: !And
    - !Equals [!Ref CreateCloudFrontDistributions, 'true']
    - !Not [!Equals [!Ref CertificateArn, '']]
  ShouldCreateNewCloudFront: !Equals [!Ref CreateCloudFrontDistributions, 'true']
  ShouldKeepCloudFront: !Equals [!Ref KeepExistingCloudFront, 'true']
  HasScheduledTask: !Equals [!Ref CreateScheduledTask, 'true']

Resources:
  # IAM Roles for ECS Tasks
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-ecsTaskRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Path: /

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-ecsTaskExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ParameterStoreAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                  - ssm:GetParameter
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/*'
      Path: /

  # ECR Repository
  ECRRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Condition: CreateECRRepository
    Properties:
      RepositoryName: !Ref ProjectName
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  # Security Group for ECS Tasks
  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Security group for ${ProjectName} ECS tasks'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          CidrIp: 0.0.0.0/0

  # Load Balancer Security Group
  LBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Security group for ${ProjectName} load balancer'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-cluster'
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}'
      RetentionInDays: 30

  # Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Condition: CreateNewTaskDefinition
    Properties:
      Family: !Ref ProjectName
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: !Ref ProjectName
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}:latest'
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              HostPort: !Ref ContainerPort
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: !Sub '${ContainerPort}'
            - Name: MONGODB_URI
              Value: YOUR_MONGODB_URI

  # Internet-Facing Load Balancer
  InternetLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-lb'
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !GetAtt LBSecurityGroup.GroupId
      Type: application

  # Production Target Group
  ProdTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-prod-tg'
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: '/health'
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  # Test Target Group for Blue-Green Deployment
  TestTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-test-tg'
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: '/health'
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  # Production Listener
  ProdListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ProdTargetGroup
      LoadBalancerArn: !Ref InternetLoadBalancer
      Port: 80
      Protocol: HTTP

  # Test Listener for Blue-Green Deployment
  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TestTargetGroup
      LoadBalancerArn: !Ref InternetLoadBalancer
      Port: 8080
      Protocol: HTTP

  # ECS Service
  ECSService:
    Type: AWS::ECS::Service
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    DependsOn:
      - ProdListener
      - TestListener
    Properties:
      ServiceName: !Sub '${ProjectName}-service'
      Cluster: !Ref ECSCluster
      # Hard-code the task definition to prevent CloudFormation from updating it
      # All task definition updates should be handled by CodeDeploy
      TaskDefinition: !Sub '${ProjectName}:1'
      LaunchType: FARGATE
      DesiredCount: 0
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ECSSecurityGroup
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - ContainerName: !Sub '${ProjectName}'
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref ProdTargetGroup
      # CODE_DEPLOY controller — task definition updates must go through CodeDeploy
      DeploymentController:
        Type: CODE_DEPLOY
      Tags:
        - Key: UpdatedAt
          Value: !Ref AWS::AccountId

  # Application Auto Scaling for ECS Service
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 4
      MinCapacity: 1
      ResourceId: !Join
        - '/'
        - - service
          - !Ref ECSCluster
          - !GetAtt ECSService.Name
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      RoleARN: !GetAtt AutoScalingRole.Arn

  # Auto Scaling Policy based on CPU utilization
  ScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${ProjectName}-cpu-scaling-policy
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70.0
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  # ─── Optional: Scheduled Task Infrastructure ──────────────────────────────

  # Scheduled Task Definition (opt-in via CreateScheduledTask=true)
  ScheduledTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: HasScheduledTask
    Properties:
      Family: !Sub '${ProjectName}-scheduled'
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: 512
      Memory: 1024
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: !Sub '${ProjectName}-scheduled'
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}:latest'
          Essential: true
          Command:
            - npm
            - run
            - schedule
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ScheduledLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: scheduled
          Environment:
            - Name: NODE_ENV
              Value: production

  # CloudWatch Log Group for Scheduled Tasks
  ScheduledLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasScheduledTask
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}-scheduled'
      RetentionInDays: 30

  # IAM Role for EventBridge to run ECS tasks
  EventBridgeECSRole:
    Type: AWS::IAM::Role
    Condition: HasScheduledTask
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ECSTaskExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:RunTask
                Resource: !Ref ScheduledTaskDefinition
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt ECSTaskExecutionRole.Arn
                  - !GetAtt ECSTaskRole.Arn

  # EventBridge Rule — weekly schedule (Monday 6 AM UTC by default; adjust as needed)
  WeeklyScheduledRule:
    Type: AWS::Events::Rule
    Condition: HasScheduledTask
    Properties:
      Name: !Sub '${ProjectName}-weekly-schedule'
      Description: !Sub 'Trigger ${ProjectName} scheduled task every Monday at 6 AM UTC'
      ScheduleExpression: 'cron(0 6 ? * MON *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt ECSCluster.Arn
          Id: !Sub '${ProjectName}-scheduled-target'
          RoleArn: !GetAtt EventBridgeECSRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref ScheduledTaskDefinition
            LaunchType: FARGATE
            NetworkConfiguration:
              AwsVpcConfiguration:
                AssignPublicIp: ENABLED
                SecurityGroups:
                  - !Ref ECSSecurityGroup
                Subnets: !Ref SubnetIds

  # CloudWatch Alarm for Failed Scheduled Tasks
  ScheduledTaskFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasScheduledTask
    Properties:
      AlarmName: !Sub '${ProjectName}-scheduled-task-failure'
      AlarmDescription: !Sub 'Alert when ${ProjectName} scheduled task fails'
      MetricName: TasksStoppedReason
      Namespace: AWS/ECS
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: ClusterName
          Value: !Ref ECSCluster
        - Name: ServiceName
          Value: !Sub '${ProjectName}-scheduled'
      AlarmActions:
        - !Ref ScheduledTaskFailureTopic

  # SNS Topic for Scheduled Task Failure Notifications
  ScheduledTaskFailureTopic:
    Type: AWS::SNS::Topic
    Condition: HasScheduledTask
    Properties:
      TopicName: !Sub '${ProjectName}-scheduled-failures'
      DisplayName: !Sub '${ProjectName} Scheduled Task Failures'

  # ─── IAM Roles ────────────────────────────────────────────────────────────

  # IAM Role for Auto Scaling
  AutoScalingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: application-autoscaling.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceAutoscaleRole'

  # CodeDeploy Application
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Condition: ShouldCreateCodeDeployApp
    Properties:
      ApplicationName: !Sub '${ProjectName}-app'
      ComputePlatform: ECS

  # CodeDeploy Deployment Group
  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Condition: ShouldCreateCodeDeployApp
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub '${ProjectName}-dg'
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      ECSServices:
        - ClusterName: !Ref ECSCluster
          ServiceName: !GetAtt ECSService.Name
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns:
                - !Ref ProdListener
            TestTrafficRoute:
              ListenerArns:
                - !Ref TestListener
            TargetGroups:
              - Name: !GetAtt ProdTargetGroup.TargetGroupName
              - Name: !GetAtt TestTargetGroup.TargetGroupName
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5

  # CodeDeploy Service Role
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-CodeDeployServiceRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS
      Policies:
        - PolicyName: S3ArtifactAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${ProjectName}-pipeline-artifactbucket-*'
                  - !Sub 'arn:aws:s3:::${ProjectName}-pipeline-artifactbucket-*/*'

  # CloudFront Origin Access Identity for S3
  CloudFrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Condition: ShouldCreateCloudFrontDistributions
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub 'OAI for ${ProjectName} UI'

  # S3 Bucket for UI
  UIBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateUIBucket
    Properties:
      BucketName: !Sub '${ProjectName}-pipeline-ui'
      AccessControl: PublicRead
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  # Combined CloudFront Distribution for both API and UI
  CombinedDistribution:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Condition: ShouldCreateNewCloudFront
    Properties:
      DistributionConfig:
        Comment: !Sub '${ProjectName} Combined Distribution'
        Aliases: !If [HasCertificate, [!Sub '${ProjectName}.example.com'], !Ref "AWS::NoValue"]
        Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: ApiOrigin
            DomainName: !GetAtt InternetLoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
          - !If
            - ShouldCreateUIBucket
            - Id: UiOrigin
              DomainName: !Sub '${UIBucket.BucketName}.s3-website-${AWS::Region}.amazonaws.com'
              CustomOriginConfig:
                HTTPPort: 80
                HTTPSPort: 443
                OriginProtocolPolicy: http-only
                OriginSSLProtocols:
                  - TLSv1.2
                OriginReadTimeout: 30
                OriginKeepaliveTimeout: 5
            - Id: UiOrigin
              DomainName: !Sub '${ProjectName}-pipeline-ui.s3-website-${AWS::Region}.amazonaws.com'
              CustomOriginConfig:
                HTTPPort: 80
                HTTPSPort: 443
                OriginProtocolPolicy: http-only
                OriginSSLProtocols:
                  - TLSv1.2
                OriginReadTimeout: 30
                OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: UiOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true
        CacheBehaviors:
          - PathPattern: '/api*'
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            ForwardedValues:
              QueryString: true
              Cookies:
                Forward: all
              Headers:
                - Authorization
                - Origin
                - Access-Control-Request-Method
                - Access-Control-Request-Headers
            Compress: true
        CustomErrorResponses:
          - ErrorCode: 404
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 300
        ViewerCertificate:
          AcmCertificateArn: !If [HasCertificate, !Ref CertificateArn, !Ref "AWS::NoValue"]
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: !If [HasCertificate, "sni-only", "vip"]
          CloudFrontDefaultCertificate: !If [HasCertificate, !Ref "AWS::NoValue", true]

  # S3 Bucket Policy for CloudFront Access
  S3BucketPolicyForCloudFront:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldCreateUIBucket
    Properties:
      Bucket: !Ref UIBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub 'arn:aws:s3:::${UIBucket.BucketName}/*'

Outputs:
  ECRRepositoryUri:
    Description: URI of the ECR repository
    Value: !If
      - CreateECRRepository
      - !GetAtt ECRRepository.RepositoryUri
      - !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}'

  LoadBalancerDNS:
    Description: DNS name of the load balancer
    Value: !GetAtt InternetLoadBalancer.DNSName

  ECSCluster:
    Description: ECS Cluster
    Value: !Ref ECSCluster

  ECSService:
    Description: ECS Service
    Value: !Ref ECSService

  TaskDefinition:
    Description: Task Definition
    Condition: CreateNewTaskDefinition
    Value: !Ref TaskDefinition

  CodeDeployApplication:
    Description: CodeDeploy Application
    Condition: ShouldCreateCodeDeployApp
    Value: !Ref CodeDeployApplication

  CodeDeployDeploymentGroup:
    Description: CodeDeploy Deployment Group
    Condition: ShouldCreateCodeDeployApp
    Value: !Ref CodeDeployDeploymentGroup

  CombinedDistributionId:
    Description: ID of the combined CloudFront distribution
    Condition: ShouldCreateNewCloudFront
    Value: !Ref CombinedDistribution

  CombinedDistributionDomainName:
    Description: Domain name of the combined CloudFront distribution
    Condition: ShouldCreateNewCloudFront
    Value: !GetAtt CombinedDistribution.DomainName

  ScheduledTaskDefinition:
    Description: Task Definition for scheduled task
    Condition: HasScheduledTask
    Value: !Ref ScheduledTaskDefinition

  WeeklyScheduledRule:
    Description: EventBridge rule for weekly scheduled task
    Condition: HasScheduledTask
    Value: !Ref WeeklyScheduledRule

  ScheduledTaskFailureTopic:
    Description: SNS topic for scheduled task failure notifications
    Condition: HasScheduledTask
    Value: !Ref ScheduledTaskFailureTopic
